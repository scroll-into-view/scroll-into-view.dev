name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: lts
          cache: true
      # Format, lint (type-aware) and type-check the .ts/.tsx files
      - run: vp check
      # Unused files, exports, and dependencies
      - run: vp exec knip
      # astro check also type-checks the .astro files
      - run: vp run typecheck
      - run: vp run build
